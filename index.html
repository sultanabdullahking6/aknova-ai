<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AKNOVA AI</title>
<meta name="description" content="AKNOVA AI — a fast, focused AI assistant.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><radialGradient id=%22g%22><stop offset=%220%25%22 stop-color=%22%23FFB84D%22/><stop offset=%2245%25%22 stop-color=%22%23FF4D8D%22/><stop offset=%22100%25%22 stop-color=%22%236E5BFF%22/></radialGradient></defs><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22url(%23g)%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<canvas id="starfield" aria-hidden="true"></canvas>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="nova-mark" aria-hidden="true">
          <span class="nova-glow"></span>
          <span class="nova-core"></span>
          <span class="nova-ring nova-ring--1"></span>
          <span class="nova-ring nova-ring--2"></span>
        </span>
        <span class="brand-word">AKNOVA<span class="brand-ai">AI</span></span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      New chat
    </button>

    <div class="history-label">Recent</div>
    <div class="history-list" id="historyList">
      <p class="history-empty">Your conversations will show up here.</p>
    </div>

    <div class="sidebar-foot">
      <button class="sidebar-login-btn" id="loginBtn">
        <span class="sidebar-login-avatar">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 8a3 3 0 100-6 3 3 0 000 6zM2.5 14a5.5 5.5 0 0111 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        Log in
      </button>
      <button class="user-chip" id="userChip" hidden>
        <span class="user-avatar" id="userAvatar"></span>
        <span class="user-name" id="userName"></span>
        <span class="icon-btn logout-icon" id="logoutBtn" aria-label="Log out" title="Log out">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M11 11l3-3-3-3M14 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <span class="topbar-title">AKNOVA AI</span>
      <span class="topbar-tag">Ignite the conversation</span>
      <div class="topbar-spacer"></div>
    </header>

    <section class="chat-scroll" id="chatScroll">
      <div class="welcome" id="welcome">
        <span class="nova-mark nova-mark--lg" aria-hidden="true">
          <span class="nova-glow"></span>
          <span class="nova-core"></span>
          <span class="nova-ring nova-ring--1"></span>
          <span class="nova-ring nova-ring--2"></span>
        </span>
        <h1>What are we <span class="grad-word">building</span> today?</h1>
        <p>Ask AKNOVA anything — code, ideas, drafts, or a straight answer.</p>

        <div class="prompt-grid">
          <button class="prompt-chip" data-prompt="Explain how a nova forms, in simple terms">Explain a tricky concept</button>
          <button class="prompt-chip" data-prompt="Help me write a professional email asking for a deadline extension">Draft an email</button>
          <button class="prompt-chip" data-prompt="Give me 5 project ideas using an ESP32 and a temperature sensor">Brainstorm project ideas</button>
          <button class="prompt-chip" data-prompt="Write a short Python script that renames all files in a folder">Write some code</button>
        </div>
      </div>

      <div class="messages" id="messages"></div>
    </section>

    <form class="composer" id="composerForm">
      <div class="composer-inner">
        <textarea
          id="composerInput"
          class="composer-input"
          placeholder="Message AKNOVA AI..."
          rows="1"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h11M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="composer-hint">AKNOVA AI can make mistakes. Check important info.</p>
    </form>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
